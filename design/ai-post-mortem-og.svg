<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <!-- Source for public/images/ai-post-mortem-og.png (link preview, render at 1200x627).
       Simplified version of ai-post-mortem-cover.svg: bigger shapes, thicker strokes, less text. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#131c2e"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="627">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="627">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <marker id="arCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="26" markerHeight="26" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#22d3ee"/>
    </marker>
    <marker id="arPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="30" markerHeight="30" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#c084fc"/>
    </marker>
    <path id="hex" d="M0 -44L38.1 -22L38.1 22L0 44L-38.1 22L-38.1 -22Z"/>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>

  <!-- approved path: engineer -> production -->
  <path d="M980 194C950 30 260 30 222 172" fill="none" stroke="#c084fc" stroke-width="6" filter="url(#glow)" marker-end="url(#arPurple)"/>
  <circle cx="604" cy="69" r="34" fill="#0f2a1c" stroke="#4ade80" stroke-width="5" filter="url(#glow)"/>
  <path d="M588 69l11 11 21-22" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- blocked path: AI -> production -->
  <path d="M600 400C600 530 400 560 322 524" fill="none" stroke="#ef4444" stroke-width="6" stroke-dasharray="18 14"/>
  <circle cx="300" cy="514" r="32" fill="#2a0f12" stroke="#ef4444" stroke-width="5" filter="url(#glow)"/>
  <path d="M287 501l26 26M313 501l-26 26" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>

  <!-- production -->
  <g filter="url(#glow)">
    <g transform="translate(220 290)" fill="#0f1b26" stroke="#22d3ee" stroke-width="5">
      <use href="#hex" x="0" y="0"/>
      <use href="#hex" x="-86" y="0"/>
      <use href="#hex" x="86" y="0"/>
      <use href="#hex" x="-43" y="-75"/>
      <use href="#hex" x="-43" y="75"/>
      <use href="#hex" x="43" y="75"/>
    </g>
  </g>
  <g transform="translate(220 290)" fill="#22d3ee">
    <rect x="-11" y="-11" width="22" height="22" rx="4"/>
    <rect x="-97" y="-11" width="22" height="22" rx="4"/>
    <rect x="75" y="-11" width="22" height="22" rx="4"/>
    <rect x="-54" y="-86" width="22" height="22" rx="4"/>
    <rect x="-54" y="64" width="22" height="22" rx="4"/>
    <rect x="32" y="64" width="22" height="22" rx="4"/>
  </g>
  <circle cx="263" cy="215" r="60" fill="#ef4444" opacity="0.4" filter="url(#halo)"/>
  <g filter="url(#glow)">
    <use href="#hex" transform="translate(263 215)" fill="#3a1015" stroke="#ef4444" stroke-width="5"/>
  </g>
  <path d="M263 194v26" stroke="#fecaca" stroke-width="8" stroke-linecap="round"/>
  <circle cx="263" cy="235" r="5" fill="#fecaca"/>
  <text x="220" y="462" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="3" fill="#d5d7db">PRODUCTION</text>

  <!-- read flows -->
  <g stroke="#22d3ee" stroke-width="6" fill="none" filter="url(#glow)">
    <path d="M370 240H492" marker-end="url(#arCyan)"/>
    <path d="M370 290H492" marker-end="url(#arCyan)"/>
    <path d="M370 340H492" marker-end="url(#arCyan)"/>
  </g>

  <!-- AI chip -->
  <rect x="515" y="205" width="170" height="170" rx="30" fill="#22d3ee" opacity="0.28" filter="url(#halo)"/>
  <g stroke="#22d3ee" stroke-width="5" stroke-linecap="round">
    <path d="M555 205v-18M585 205v-18M615 205v-18M645 205v-18"/>
    <path d="M555 375v18M585 375v18M615 375v18M645 375v18"/>
  </g>
  <rect x="515" y="205" width="170" height="170" rx="30" fill="#0f1b26" stroke="#22d3ee" stroke-width="6" filter="url(#glow)"/>
  <text x="600" y="314" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="76" font-weight="700" fill="#a5f3fc">AI</text>
  <path d="M652 226c2.5 11 6 14.5 17 17c-11 2.5-14.5 6-17 17c-2.5-11-6-14.5-17-17c11-2.5 14.5-6 17-17z" fill="#a5f3fc"/>

  <!-- AI -> engineer -->
  <path d="M712 290H866" stroke="#22d3ee" stroke-width="6" fill="none" filter="url(#glow)" marker-end="url(#arCyan)"/>

  <!-- engineer -->
  <circle cx="980" cy="290" r="92" fill="#a855f7" opacity="0.3" filter="url(#halo)"/>
  <circle cx="980" cy="290" r="92" fill="#1a1326" stroke="#c084fc" stroke-width="6" filter="url(#glow)"/>
  <circle cx="980" cy="264" r="28" fill="#d8b4fe"/>
  <path d="M931 340c0-30 22-46 49-46s49 16 49 46z" fill="#d8b4fe"/>
  <text x="980" y="462" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="3" fill="#d5d7db">ENGINEER</text>

  <!-- tagline -->
  <text x="790" y="590" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="40" font-weight="700" fill="#4ade80" filter="url(#glow)">$ ai --mode=read-only</text>
</svg>

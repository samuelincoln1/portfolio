<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 893" width="1600" height="893">
  <!-- Source for public/images/ai-post-mortem-cover.jpg (render at 1600x893). -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#121a2b"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowLine" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="893">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <marker id="arCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#22d3ee"/>
    </marker>
    <marker id="arPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#c084fc"/>
    </marker>
    <path id="hex" d="M0 -36L31.2 -18L31.2 18L0 36L-31.2 18L-31.2 -18Z"/>
  </defs>

  <rect width="1600" height="893" fill="url(#bg)"/>
  <rect width="1600" height="893" fill="url(#grid)"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.16" stroke-width="2">
    <path d="M0 120H90L130 80H260"/><circle cx="266" cy="80" r="5"/>
    <path d="M0 160H70L110 200H190"/><circle cx="196" cy="200" r="5"/>
    <path d="M1600 110H1500L1460 70H1350"/><circle cx="1344" cy="70" r="5"/>
    <path d="M1600 150H1520L1480 190H1410"/><circle cx="1404" cy="190" r="5"/>
    <path d="M0 790H120L160 750H240"/><circle cx="246" cy="750" r="5"/>
    <path d="M0 830H160L190 860H300"/><circle cx="306" cy="860" r="5"/>
    <path d="M1600 780H1470L1430 740H1350"/><circle cx="1344" cy="740" r="5"/>
    <path d="M1600 830H1440L1410 860H1300"/><circle cx="1294" cy="860" r="5"/>
  </g>

  <!-- APPROVED PATH: engineer -> production (top arc) -->
  <path d="M1340 312C1300 90 300 90 262 288" fill="none" stroke="#c084fc" stroke-width="4" filter="url(#glow)" marker-end="url(#arPurple)"/>
  <circle cx="800" cy="143" r="28" fill="#0f2a1c" stroke="#4ade80" stroke-width="3" filter="url(#glow)"/>
  <path d="M787 143l9 9 17-18" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="92" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" letter-spacing="3" fill="#d8b4fe">REVIEWED CHANGE</text>

  <!-- BLOCKED PATH: AI -> production (bottom arc) -->
  <path d="M800 482C800 720 420 740 352 656" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="14 12" stroke-opacity="0.9"/>
  <circle cx="334" cy="636" r="28" fill="#2a0f12" stroke="#ef4444" stroke-width="3" filter="url(#glow)"/>
  <path d="M323 625l22 22M345 625l-22 22" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <text x="600" y="745" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" letter-spacing="3" fill="#f87171">NO DIRECT WRITES</text>

  <!-- PRODUCTION cluster -->
  <g transform="translate(260 400)">
    <g fill="#0f1b26" stroke="#22d3ee" stroke-width="3" filter="url(#glow)">
      <use href="#hex" x="0" y="0"/>
      <use href="#hex" x="-74" y="0"/>
      <use href="#hex" x="74" y="0"/>
      <use href="#hex" x="-37" y="-64"/>
      <use href="#hex" x="-37" y="64"/>
      <use href="#hex" x="37" y="64"/>
    </g>
    <g fill="#22d3ee">
      <rect x="-9" y="-9" width="18" height="18" rx="3"/>
      <rect x="-83" y="-9" width="18" height="18" rx="3"/>
      <rect x="65" y="-9" width="18" height="18" rx="3"/>
      <rect x="-46" y="-73" width="18" height="18" rx="3"/>
      <rect x="-46" y="55" width="18" height="18" rx="3"/>
      <rect x="28" y="55" width="18" height="18" rx="3"/>
    </g>
    <!-- incident -->
    <circle cx="37" cy="-64" r="58" fill="#ef4444" opacity="0.35" filter="url(#glowSoft)"/>
    <use href="#hex" x="37" y="-64" fill="#3a1015" stroke="#ef4444" stroke-width="3" filter="url(#glow)"/>
    <path d="M37 -82v24" stroke="#fecaca" stroke-width="6" stroke-linecap="round"/>
    <circle cx="37" cy="-46" r="4" fill="#fecaca"/>
  </g>
  <text x="260" y="550" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="26" letter-spacing="4" fill="#c9ccd3">PRODUCTION</text>

  <!-- READ flows: production -> AI -->
  <g stroke="#22d3ee" stroke-width="3" fill="none" filter="url(#glowLine)">
    <path d="M380 340H700" marker-end="url(#arCyan)"/>
    <path d="M380 400H700" marker-end="url(#arCyan)"/>
    <path d="M380 460H700" marker-end="url(#arCyan)"/>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#67e8f9" text-anchor="middle">
    <rect x="474" y="322" width="112" height="36" rx="18" fill="#0d1520" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="530" y="347">logs</text>
    <rect x="474" y="382" width="112" height="36" rx="18" fill="#0d1520" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="530" y="407">metrics</text>
    <rect x="474" y="442" width="112" height="36" rx="18" fill="#0d1520" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="530" y="467">queues</text>
  </g>

  <!-- AI chip -->
  <g>
    <rect x="725" y="325" width="150" height="150" rx="26" fill="#22d3ee" opacity="0.25" filter="url(#glowSoft)"/>
    <g stroke="#22d3ee" stroke-width="3" stroke-linecap="round">
      <path d="M760 325v-16M790 325v-16M820 325v-16M850 325v-16"/>
      <path d="M760 475v16M790 475v16M820 475v16M850 475v16"/>
      <path d="M725 360h-16M725 390h-16M725 420h-16M725 450h-16"/>
      <path d="M875 360h16M875 390h16M875 420h16M875 450h16"/>
    </g>
    <rect x="725" y="325" width="150" height="150" rx="26" fill="#0f1b26" stroke="#22d3ee" stroke-width="4" filter="url(#glow)"/>
    <text x="800" y="420" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="58" font-weight="700" fill="#a5f3fc">AI</text>
    <path d="M848 344c2 9 5 12 14 14c-9 2-12 5-14 14c-2-9-5-12-14-14c9-2 12-5 14-14z" fill="#a5f3fc"/>
  </g>

  <!-- AI -> hypotheses -> engineer -->
  <g stroke="#22d3ee" stroke-width="3" fill="none" filter="url(#glowLine)">
    <path d="M905 400H1010" marker-end="url(#arCyan)"/>
    <path d="M1125 400H1240" marker-end="url(#arCyan)"/>
  </g>
  <g transform="translate(1068 400)">
    <rect x="-34" y="-58" width="76" height="98" rx="10" fill="#0f1b26" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2" transform="rotate(-8)"/>
    <rect x="-40" y="-50" width="76" height="98" rx="10" fill="#111d2a" stroke="#22d3ee" stroke-width="3" filter="url(#glow)"/>
    <g stroke="#67e8f9" stroke-width="4" stroke-linecap="round">
      <path d="M-26 -28h40M-26 -12h48M-26 4h32M-26 20h44"/>
    </g>
  </g>
  <text x="1068" y="500" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#67e8f9">hypotheses</text>

  <!-- ENGINEER -->
  <circle cx="1340" cy="400" r="80" fill="#a855f7" opacity="0.28" filter="url(#glowSoft)"/>
  <circle cx="1340" cy="400" r="80" fill="#1a1326" stroke="#c084fc" stroke-width="4" filter="url(#glow)"/>
  <circle cx="1340" cy="378" r="24" fill="#d8b4fe"/>
  <path d="M1298 445c0-26 19-40 42-40s42 14 42 40z" fill="#d8b4fe"/>
  <text x="1340" y="550" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="26" letter-spacing="4" fill="#c9ccd3">ENGINEER</text>

  <!-- tagline -->
  <text x="800" y="840" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="40" fill="#4ade80" filter="url(#glow)">$ ai --mode=read-only</text>
</svg>

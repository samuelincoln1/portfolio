name: Deploy to AWS S3 and CloudFront

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      # Pull requests only validate the build; deploy happens on main only.
      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        if: github.ref == 'refs/heads/main'
        run: |
          # Hashed assets: safe to cache forever. Uploaded first so new HTML never points to missing files.
          aws s3 sync out/_next/static/ s3://${{ secrets.S3_BUCKET_NAME }}/_next/static/ --cache-control "public,max-age=31536000,immutable"
          # Everything else (HTML, images, PDFs, locales): browsers revalidate on every visit.
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET_NAME }}/ --delete --exclude "_next/static/*" --cache-control "public,max-age=0,must-revalidate"
          # Remove hashed assets from previous builds only after the new HTML is live.
          aws s3 sync out/_next/static/ s3://${{ secrets.S3_BUCKET_NAME }}/_next/static/ --delete --cache-control "public,max-age=31536000,immutable"

      - name: Invalidate CloudFront Cache
        if: github.ref == 'refs/heads/main'
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
